name: CI
on:
  push:
    branches:
      - main
      - sprint-0/flood-zone-spatial-prototype
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: sprint-0-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 30
